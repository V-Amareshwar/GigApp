kind = "web"
previewPath = "/"
title = "GigWork"
version = "1.0.0"
id = "artifacts/gigwork"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23524

[services.development]
run = "pnpm --filter @workspace/gigwork run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gigwork", "run", "build" ]
publicDir = "artifacts/gigwork/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23524"
BASE_PATH = "/"
